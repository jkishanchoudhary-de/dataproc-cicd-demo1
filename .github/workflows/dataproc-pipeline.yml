name: Dataproc PySpark CI/CD

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dataproc-job:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Authenticate to GCP (must be before setup-gcloud)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # 3️⃣ Setup gcloud SDK
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kishan-learning-project-1

      # 4️⃣ Explicitly activate SA for gcloud (optional but ensures gcloud sees credentials)
      - name: Activate service account for gcloud
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > sa_key.json
          gcloud auth activate-service-account --key-file=sa_key.json
          gcloud config set project kishan-learning-project-1

      # 5️⃣ Upload PySpark job to Cloud Storage
      - name: Upload PySpark Job to GCS
        run: |
          gsutil cp pysaprk_jobs/etl_job.py gs://dataproc-cicd-demo1/pysaprk_jobs/

      # 6️⃣ Submit PySpark job to Dataproc
      - name: Submit Dataproc Job
        run: |
          gcloud dataproc jobs submit pyspark gs://dataproc-cicd-demo1/pysaprk_jobs/etl_job.py \
            --cluster=cluster-dataproc-cicd-demo1 \
            --region=us-west1 \
            --quiet